<p>counter-app works!</p>

<div  class="container mt-5">
    <div>
        <h1>Counter App</h1>

       <h3 class= "text-center">{{count()}}</h3>
    </div>

    <div  class="mb-4">
        <button class="btn btn-success  m-3"  (click)="increase()">Increase</button>
        <button class="btn btn-primary m -3" (click)="reset()">Reset</button>
        <button class="btn btn-danger m-3 " (click)="decrease()">Decrease</button>
    </div>
</div>
