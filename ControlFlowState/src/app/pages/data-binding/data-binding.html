
<p>Name: {{name()}}</p>

<input type="text" [value]="name()"  (input)="name.set($event.target.value)">

<button>UpdateName</button>


<p>Age: {{age}}</p>
<!-- <input type="number"  [(ngModel)]="age">         // [value]="age" no need use -->

<input type="text" [ngModel]="age" (ngModelChange)="age=$event">

<h1>{{userData().name}}</h1>
<input type="text" [value]="userData().name" (input)="updateUserData('name', $event.target.value)">

<hr>

<h1>{{userData().age}}</h1>
<input type="text" [value]="userData().age" (input)="updateUserData('age', $event.target.value)">

<hr>

<h1>{{userData().email}}</h1>
<input type="text" [value]="userData().email" (input)="updateUserData('email', $event.target.value)">

<hr>


<p> EMPname: {{empName()}}</p>


<input type="text"  [(ngModel)]="empName">

<hr>


<h2>{{EmpComp}}</h2>

<input type="text" [(ngModel)]="EmpComp">
